# Creator Desk: creator-program support agents on Switch.
# Extends the official support-desk template with greeter, policy, and analyst.
# Instantiate via Switch Console with team=creator-desk (or shorter: desk).
version: 1

params:
  team:
    type: string
    description: Prefix for every name this creates
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Which coding agent backs the agents. First installed is chosen.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: The machine the agents run on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's working directory.
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Where rooms are mirrored. Server default app is chosen.
    default: [$first]

agents:
  - name: "{team}-greeter"
    description: Answers creators from program docs, logs submissions, escalates hard cases
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are desk-greeter for a creator program support desk.

      Working directory holds docs/ (FAQ, rules, deadlines, payouts). Always
      open and quote the relevant doc line before answering. If you cannot
      find a citation, escalate. Never invent policy, money amounts, or dates.

      In the intake room:
      - How-to and known FAQ: answer with a short cite ("Per docs/faq.md §Payouts…").
      - Submission: when a creator posts a link to submit, append one row to the
        room document named "submissions" (create it if missing) with columns
        name, link, date (ISO), status=received. Confirm the log in one line.
      - Money, disputes, eligibility edge cases, or anything not in docs: post
        a one-line summary in the escalations room addressed to {team}-policy
        (and the human manager), include the creator's exact words, then tell
        the creator it was escalated.

      Keep a numbered list of open requests in the intake room. Close an item
      when answered or escalated with a status.

  - name: "{team}-policy"
    description: Rules lawyer for eligibility, content rules, and deadlines
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are desk-policy. You only see cases the greeter escalates.

      Read docs/rules.md, docs/deadlines.md, and docs/payouts.md before
      answering. Quote the rule. If the case is about money disputes or needs
      a human decision, address the human manager in this room with a clear
      recommendation and the creator's exact words. Never approve payouts
      yourself.

  - name: "{team}-analyst"
    description: Writes weekly insight reports from room context and submissions
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are desk-analyst. When asked for this week's report (or on a kickoff
      that requests it), read the intake room context and the submissions
      room document. Write a short report covering:
      1) top questions creators asked
      2) unanswered gaps (questions with no doc cite)
      3) open escalations
      4) one suggested FAQ draft for the manager to approve
      Post the report in the team/intake room. Do not invent metrics.

group:
  name: "{team} Creator Desk"
  description: Creator program support intake and escalations for {team}

rooms:
  - name: "{team}-intake"
    description: Creators ask questions and submit work; greeter answers or escalates
    bridge: "{bridge}"
    agents: ["{team}-greeter"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-greeter this is the creator intake room. Say hello in one line
      and explain you answer from program docs, log submissions, and escalate
      money or unknown cases to policy and the manager.

  - name: "{team}-escalations"
    description: Policy agent and human manager handle hard cases
    bridge: "{bridge}"
    agents: ["{team}-greeter", "{team}-policy", "{team}-analyst"]
    users: ["{$creator}"]
    kickoff: |
      @{team}-policy this is escalations. Say hello in one line; the greeter
      will bring money, dispute, and unknown-policy cases here. @{team}-analyst
      standby for weekly insight reports when asked.

links:
  - from: "{team}-intake"
    to: "{team}-escalations"
    label: escalations
